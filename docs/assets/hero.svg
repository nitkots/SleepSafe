<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="SleepSafe: hear your night, understand your sleep">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset=".25" stop-color="#7dd3fc"/>
      <stop offset=".75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="band"><rect x="0" y="0" width="960" height="300"/></clipPath>
  </defs>
  <rect width="960" height="300" rx="18" fill="url(#sky)"/>

  <!-- stars twinkle -->
  <g fill="#e0e7ff">
    <circle cx="80" cy="50" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="34" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="70" r="1.4"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="42" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="80" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="56" r="1.5"><animate attributeName="opacity" values=".4;1;.4" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="860" cy="70" r="26" fill="#fde68a"/>
  <circle cx="872" cy="62" r="24" fill="#131a3a"/>

  <!-- title -->
  <text x="60" y="128" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="56" font-weight="700">SleepSafe</text>
  <text x="62" y="164" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20">Hear your night. Understand your sleep.</text>

  <!-- breathing waveform: a slow breath rhythm scrolls left, with a pause where an apnea would be -->
  <g clip-path="url(#band)">
    <g>
      <path fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round"
        d="M0 235 q30 -34 60 0 t60 0 t60 0 t60 0 l80 0 q30 -44 60 0 t60 0 t60 0 t60 0 t60 0 l80 0 q30 -44 60 0 t60 0 t60 0 t60 0
           M960 235 q30 -34 60 0 t60 0 t60 0 t60 0 l80 0 q30 -44 60 0 t60 0 t60 0 t60 0 t60 0 l80 0 q30 -44 60 0 t60 0 t60 0 t60 0"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- live recording dot -->
  <circle cx="64" cy="276" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="78" y="281" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">recording · 16 kHz mono · 10 s chunks</text>
</svg>
